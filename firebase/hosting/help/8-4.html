<p><b>[+방명록 남기기]</b>를 누르면 방명록 창이 열려요. <b>서로 친구</b>인 사람만 글을 남길 수 있어요(100자).</p>
<p>같은 창의 <b>웹박수</b> 그림을 누르면 박수가 쳐져요. 한 사람이 <b>하루 5번</b>까지예요. 집 주인은 <b>[이미지 등록]</b>으로 박수 그림을 바꾸고, 박수 칠 때 터지는 <b>폭죽 이모지</b>(기본 🎉)도 정할 수 있어요.</p>
