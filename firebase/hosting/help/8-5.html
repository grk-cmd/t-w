<p>마이홈 오른쪽의 작은 바탕화면이에요. 작업표시줄의 <b>환경 설정</b>에서 <b>배경화면 변경</b>(색상 · 파일 · URL · 초기화), <b>폴더 숨기기</b>, <b>폴더 자유배치</b>를 할 수 있어요.</p>
<p><b>📚 북마크</b> 폴더는 책장이에요. 책을 최대 <b>50권</b> 꽂을 수 있고, 공개한 책만 방문자에게 보여요.</p>
