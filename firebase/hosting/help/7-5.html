<h1>7-5. 친구 초대</h1>
<p>워킹룸 · 투게더룸 모두 같아요.</p>
<figure class="narrow"><img src="/img/6/07.webp" loading="lazy" alt=""></figure>
<p>방에 들어간 뒤 <b>[🙋 친구 초대하기]</b>를 누르면 친구 목록이 나와요. 접속 중인 친구는 프로필 사진 오른쪽 아래에 <b>초록불</b>이 들어와요.</p>
<p>레벨 옆에 <b>🏠</b>가 붙은 친구는 이미 다른 방에 있어요. [초대]를 누르면 먼저 안내가 뜨고 버튼이 <b>[그래도]</b>로 바뀌어요. 한 번 더 누르면 초대가 가요. 받은 친구가 <b>3분</b> 안에 답하지 않으면 자동으로 거절돼요.</p>
