 .dot{fill:var(--bg-field);}
 .name{position:absolute;left:40px;bottom:64px;max-width:440px;margin:0;font:700 88px/.95 var(--font-ui);color:var(--ink);letter-spacing:-2px;}
 .tag{position:absolute;left:42px;bottom:32px;max-width:440px;margin:0;font:400 14px/20px var(--font-ui);color:var(--ink-soft);}
