# ═══ 📋 work-status-done — PR 이 머지되면 현황판 줄을 «작업완료» 로 ═══════════════════════
# docs/WORK_STATUS.md «진행 중» 표에서 브랜치 칸 = 그 PR 의 head 브랜치인 줄을 «작업완료(판) · #PR · 날짜» 로 바꿔 main 에 커밋한다.
# 머지 길이 여럿(/ship · GitHub 버튼 · 웹 세션)이라 이 워크플로 한 곳에서 한다. 판단은 전부 scripts/work-status-done.js(검사 sim-work-status-done.js).
# ⚠️ pull_request(closed) 는 base 브랜치에 있는 이 파일로 돈다 — 판 브랜치(release/*) 로 머지된 PR 도 잡으려면 main 을 판 브랜치에 합쳐 이 파일이 거기에도 있어야 한다.
# ⚠️ pull_request_target 으로 바꾸지 않는다 — 포크 PR 에 쓰기 토큰이 생긴다. 포크 PR 은 쓰기 토큰이 없어 건너뛴다(같은 저장소 브랜치만).
# GITHUB_TOKEN 으로 한 push 는 다른 워크플로(checks)를 깨우지 않는다 — 현황판 한 파일이라 괜찮다.
#   GitHub ruleset 으로 main 을 막으면 이 봇(github-actions)은 예외로 둔다.

name: work-status-done

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

# 두 PR 이 잇달아 머지되면 차례로 — 같은 파일을 동시에 push 하지 않게
concurrency:
  group: work-status-done
  cancel-in-progress: false

jobs:
  done:
    name: 현황판 작업완료
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      # 브랜치 이름은 PR 을 연 사람이 정한 값 — 셸 글에 끼우지 않고 환경 변수로만 넘긴다
      - name: 줄 바꾸기 · main 에 커밋
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # push 가 밀리면(그새 누가 현황판을 고침) 최신 main 위에서 처음부터 다시 — rebase 충돌을 풀지 않는다
          for try in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/work-status-done.js --head "$HEAD_REF" --base "$BASE_REF" --pr "$PR"
            if git diff --quiet -- docs/WORK_STATUS.md; then
              exit 0
            fi
            git commit -q -m "docs(status): 작업완료 #$PR — 머지 자동 기록" -- docs/WORK_STATUS.md
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "push 밀림 — 다시 ($try)"
            sleep $((try * 5))
          done
          echo "::error::현황판을 main 에 올리지 못함 — 손으로 그 줄을 «작업완료» 로 바꿔 주세요"
          exit 1
