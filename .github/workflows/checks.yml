# ═══ ✅ checks — push · PR 마다 `npm run check` ═══════════════════════════════
# 검사는 원본 텍스트를 읽고 Node · Python 으로만 돈다 — node_modules 가 거의 필요 없다.
# 그래서 `npm ci`(네이티브 모듈 컴파일)를 건너뛴다. 빠르고, 리눅스에서 네이티브가 안 붙어도 상관없다.
# 예외: sim-global-names.js 는 코드를 범위대로 읽으려고 typescript 파서를 쓴다 — 그것 하나만 깐다.
# run.js 종료코드: 빨강 · 시간초과 · 정본(CHECKS.md 해시) 불일치 → 1. «원본없음» 은 실패가 아니다.
# «바뀐 폴더» job 이 먼저 보고, 볼 것이 없는 검사는 건너뛴다(Skipped) — 문서만 바뀐 PR 에 5분짜리 검사를 돌리지 않게.
#   워크플로째 paths-ignore 로 빼지 않는 까닭: 실행 자체가 안 생기면 필수 검사로 걸었을 때 «대기» 로 영원히 남는다. job 의 if 로 건너뛰면 Skipped(통과로 침).
#   release-start 는 main 의 이 실행에서 «npm run check» job 이 실제로 success 일 때만 검사를 건너뛴다(Skipped 면 직접 돌림).

name: checks

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR 에 push 가 몰리면 앞 실행은 취소한다(main push 는 하나하나 끝까지 — release-start 가 그 결과를 본다)
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 바뀐 폴더
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
      admin: ${{ steps.f.outputs.admin }}
      core: ${{ steps.f.outputs.core }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          all(){ { echo app=true; echo admin=true; echo core=true; } >> "$GITHUB_OUTPUT"; echo "$1 — 전부 돈다"; exit 0; }
          # 수동 실행 · 비교 대상 없음(첫 push · 강제 push 로 사라진 커밋)은 전부
          [ "$EVENT" = workflow_dispatch ] && all '수동 실행'
          { [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; } && all '비교할 커밋 없음'
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          # 워크플로 · 저장소 설정이 바뀌면 전부
          grep -qE '^\.github/' <<< "$files" && all '.github 바뀜'
          # 웹 관리자 — 자기 폴더 · 규칙 파일(테스트가 읽는다)
          if grep -qE '^(web-admin/|firebase-database-rules\.json$)' <<< "$files"; then echo admin=true >> "$GITHUB_OUTPUT"; else echo admin=false >> "$GITHUB_OUTPUT"; fi
          # 캐릭터 코어 — 자기 폴더 · 앱에 둔 빌드 사본 · 시험이 읽는 기본 몸 GLB
          if grep -qE '^(packages/char-core/|app/vendor/char-core/|app/parts/base-glb\.js$)' <<< "$files"; then echo core=true >> "$GITHUB_OUTPUT"; else echo core=false >> "$GITHUB_OUTPUT"; fi
          # 앱 검사 — 아래 «건너뛰어도 되는 파일» 만 바뀌었으면 false.
          #   web-admin/ (run.js 가 스테이징에서 뺀다) · 문서(.md) 중 검사가 읽지 않는 것.
          #   검사가 읽는 문서: checks/ 안(CHECKS.md 정본) · docs/design-system/ · 검사 코드에 따옴표로 이름이 나오는 것(예: 'docs/ERROR_CODES.md')
          app=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in web-admin/*) continue ;; esac
            if [[ $f == *.md && $f != checks/* && $f != docs/design-system/* ]]; then
              b=$(basename "$f")
              if ! grep -qsF -e "'$f'" -e "\"$f\"" -e "'$b'" -e "\"$b\"" checks/*.js checks/*.py; then continue; fi
            fi
            echo "앱 검사가 볼 파일: $f"; app=true; break
          done <<< "$files"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  check:
    name: npm run check
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # sim-global-names.js 의 파서 — package-lock 과 같은 판 · 네이티브 없음 · 저장 안 함
      # 내려받다 네트워크가 한 번 끊겨도(ECONNRESET) 검사 전체가 빨강이 되지 않게 세 번까지 다시 해 본다
      - run: |
          for i in 1 2 3; do
            npm install --no-save --ignore-scripts --no-package-lock --fetch-retries=5 typescript@5.9.3 && exit 0
            echo "typescript 설치 실패 — ${i}번째, 10초 뒤 다시"; sleep 10
          done
          exit 1

      - name: 검사 실행
        run: node checks/run.js

  web-admin:
    name: 웹 관리자 테스트 · 빌드
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - run: npm ci
      - run: npm run lint          # oxlint + steiger(FSD 층 규칙)
      - run: npm run format:check
      - run: npm test
      - run: npm run build         # tsc(strict) 포함

  # 캐릭터 코어 — 원본(packages/char-core)을 시험 · 빌드하고, 앱이 싣는 사본(app/vendor/char-core/)이 그 빌드와 같은지 본다.
  # 0.12 에는 npm workspace 가 없어 패키지 폴더에서 자기 lock 으로 깐다.
  char-core:
    name: 캐릭터 코어 시험 · 빌드
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/char-core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/char-core/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 다르면 코어를 고치고 빌드를 안 돌린 것
      - name: 앱 사본이 빌드와 같은가
        working-directory: .
        run: |
          d=$(git status --porcelain -- app/vendor/char-core)
          if [ -n "$d" ]; then
            echo "$d"; git --no-pager diff -- app/vendor/char-core | head -40
            echo "::error::앱 사본이 빌드와 다르다 — packages/char-core 에서 npm run build 후 사본까지 커밋"
            exit 1
          fi

  # 판끼리 DB 규칙 — 앞 판(먼저 나갈 판 · main)에서 바꾼 규칙이 이 판에도 들어갔는가(scripts/rules-drift.js · 검사 sim-rules-drift.js).
  # 어긋나도 막지 않고 경고 · 요약으로 알린다: 앞 판 규칙을 옮기는 PR 이 머지되기 전엔 늘 잠깐 어긋나서, 막으면 그 판의 상관없는 PR 이 모두 빨강이 된다.
  # 다른 판 머리를 읽어야 해서 «바뀐 폴더» 와 상관없이 판 브랜치 push · 판 브랜치로 가는 PR 마다 돈다. 보지 못했으면(판 없음 · 규칙 못 읽음) 빨강.
  rules-drift:
    name: 판끼리 DB 규칙
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 다른 판 브랜치 머리 · 갈라진 곳(merge-base)까지
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # PR 이면 판 이름은 받는 판 · 규칙은 HEAD(PR 머지 결과) — 옮기는 PR 은 자기 실행에서 경고가 사라진다
      - name: 앞 판 규칙이 이 판에 있나
        env:
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: node scripts/rules-drift.js --github --target "$TARGET" --ref HEAD
