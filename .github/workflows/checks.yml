# ═══ ✅ checks — push · PR 마다 `npm run check` ═══════════════════════════════
# 검사는 원본 텍스트를 읽고 Node · Python 으로만 돈다 — node_modules 가 필요 없다.
# 그래서 `npm ci`(네이티브 모듈 컴파일)를 건너뛴다. 빠르고, 리눅스에서 네이티브가 안 붙어도 상관없다.
# run.js 종료코드: 빨강 · 시간초과 · 정본(CHECKS.md 해시) 불일치 → 1. «원본없음» 은 실패가 아니다.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 검사 실행
        run: node checks/run.js

  web-admin:
    name: 웹 관리자 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - run: npm ci
      - run: npm run lint          # oxlint + steiger(FSD 층 규칙)
      - run: npm run format:check
      - run: npm test
      - run: npm run build         # tsc(strict) 포함
