# ═══ ✅ checks — push · PR 마다 `npm run check` ═══════════════════════════════
# 검사는 원본 텍스트를 읽고 Node · Python 으로만 돈다 — node_modules 가 거의 필요 없다.
# 그래서 `npm ci`(네이티브 모듈 컴파일)를 건너뛴다. 빠르고, 리눅스에서 네이티브가 안 붙어도 상관없다.
# 예외: sim-global-names.js 는 코드를 범위대로 읽으려고 typescript 파서를 쓴다 — 그것 하나만 깐다.
# run.js 종료코드: 빨강 · 시간초과 · 정본(CHECKS.md 해시) 불일치 → 1. «원본없음» 은 실패가 아니다.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 무엇이 바뀌었나 — 문서만 바뀌면 앱 검사를, 웹 관리자가 안 바뀌면 웹 관리자 테스트를 건너뛴다(기다림 줄이기).
  # ⚠️ 나중에 «필수 검사(branch protection)» 로 걸면 건너뛴 PR 이 대기로 남는다 — 그때는 늘 도는 요약 job 을 같이 둔다.
  changes:
    name: 바뀐 곳 보기
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      app: ${{ steps.f.outputs.app }}
      admin: ${{ steps.f.outputs.admin }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; echo "admin=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then FROM="$BASE"; else FROM="$BEFORE"; fi
          # 처음 push · 지난 커밋을 못 찾으면 둘 다 돈다(놓치지 않는 쪽)
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM" 2>/dev/null; then echo "app=true" >> "$GITHUB_OUTPUT"; echo "admin=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          FILES=$(git diff --name-only "$FROM" HEAD)
          echo "바뀐 파일:"; echo "$FILES"
          # 앱 검사를 건너뛰어도 되는 파일: 문서(디자인 시스템 제외 — 검사가 읽음) · 루트 .md · 웹 관리자 · PR 틀
          APP=$(echo "$FILES" | grep -vP '^(docs/(?!design-system/)|web-admin/|[^/]+\.md$|\.github/pull_request_template\.md$)' | grep -c . || true)
          ADMIN=$(echo "$FILES" | grep -cE '^(web-admin/|\.github/workflows/checks\.yml$)' || true)
          [ "$(echo "$FILES" | grep -c '^\.github/workflows/checks\.yml$' || true)" -gt 0 ] && APP=1
          echo "app=$([ "$APP" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "admin=$([ "$ADMIN" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "앱 검사 대상 $APP 개 · 웹 관리자 $ADMIN 개"

  check:
    name: npm run check
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # sim-global-names.js 의 파서 — package-lock 과 같은 판 · 네이티브 없음 · 저장 안 함
      # 내려받다 네트워크가 한 번 끊겨도(ECONNRESET) 검사 전체가 빨강이 되지 않게 세 번까지 다시 해 본다
      - run: |
          for i in 1 2 3; do
            npm install --no-save --ignore-scripts --no-package-lock --fetch-retries=5 typescript@5.9.3 && exit 0
            echo "typescript 설치 실패 — ${i}번째, 10초 뒤 다시"; sleep 10
          done
          exit 1

      - name: 검사 실행
        run: node checks/run.js

  web-admin:
    name: 웹 관리자 테스트 · 빌드
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - run: npm ci
      - run: npm run lint          # oxlint + steiger(FSD 층 규칙)
      - run: npm run format:check
      - run: npm test
      - run: npm run build         # tsc(strict) 포함
