# ═══ 🧪 deploy-dev — 판 브랜치에 규칙이 바뀌어 올라오면 dev 프로젝트에 자동 반영 ═══════════════
# [2026-10-03] dev 와 운영 배포를 나눈다.
#   dev  : 판 브랜치(release/*) push (규칙 파일이 바뀐 커밋만) → together-working-dev  — 승인 없음
#          판 브랜치가 둘 열려 있으면 마지막에 push 된 쪽 규칙이 dev 에 남는다(10-19 판 브랜치로 바꿈)
#   운영 : 버전 태그(v*) push → release.yml 의 «규칙(운영)» 잡           — production 환경 승인 필요
# 🔐 인증은 Workload Identity Federation(키 파일 없음). GCP 쪽 조건이 «이 저장소 + dev/production 환경» 일 때만
#   토큰을 준다. vars.GCP_WIF_PROVIDER / vars.GCP_SA_EMAIL 이 비어 있으면(설정 전) 이 잡은 건너뛴다.

name: deploy-dev

on:
  push:
    branches: ['release/**']
    paths: ['firebase/firebase-database-rules.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  rules-dev:
    name: 규칙 → dev
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - name: 규칙 문법 확인
        run: node -e "JSON.parse(require('fs').readFileSync('firebase/firebase-database-rules.json','utf8'))"
      - name: firebase deploy --only database (dev)
        working-directory: firebase   # firebase.json · 규칙이 있는 폴더(#431)
        run: npx --yes firebase-tools@15.32.1 deploy --only database --project together-working-dev --non-interactive
