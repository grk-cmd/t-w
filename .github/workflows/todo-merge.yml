# ═══ 📋 todo-merge — PR 이 main 에 머지되면 본문 «할 일: <id>» 를 완료로 ═══════════════
# 본문에서 id 를 뽑고, 머지 커밋의 package.json 버전 + patch 1 을 «릴리스» 로 Cloud Function todoMergeDone 에 보낸다.
# 진행 중으로 바꾸는 일은 하지 않는다 — 머지됐을 때 완료로만. 쓰기 · 검사는 함수(functions/todo-merge.js)가 한다.
# 🔐 vars.TODO_MERGE_URL(함수 주소) · secrets.TODO_MERGE_TOKEN(함수 비밀과 같은 값)이 없으면 로그만 남기고 끝난다.
#   pull_request 이벤트라 포크에서 온 PR 은 비밀을 못 받는다 — 그때도 건너뛴다.
# 어떤 경우에도 실패(빨강)로 끝나지 않는다 — 머지 흐름을 막지 않게.

name: todo-merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  done:
    name: 할 일 완료
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: |
            package.json
            scripts/todo-merge.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 본문 · 비밀은 환경 변수로만 넘긴다(셸에 그대로 끼워 넣지 않는다 — 본문에 명령이 들어 있어도 실행되지 않게).
      - name: 할 일 완료 표시
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TODO_MERGE_URL: ${{ vars.TODO_MERGE_URL }}
          TODO_MERGE_TOKEN: ${{ secrets.TODO_MERGE_TOKEN }}
        run: node scripts/todo-merge.js || true
