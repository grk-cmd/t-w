# ═══ 🚪 min-room-ver — 방 입장 최소 버전(config/minRoomVer)을 운영에 반영 ═══════════════════
# 방 통신 형식이 바뀐 버전을 공개하고, 사용자 대부분이 업데이트한 **뒤에** 수동으로 실행한다.
# 이 값보다 낮은 앱은 방(워킹룸·투게더룸)에 못 들어간다 — 너무 일찍 올리면 업데이트 못 한 사람이 막힌다.
# 🔐 production 환경 승인이 필요하다. 설정(vars) 전이면 건너뛴다.

name: min-room-ver

on:
  workflow_dispatch:
    inputs:
      version:
        description: '방 입장 최소 버전 (예: 0.10.2) — 공개된 버전이어야 한다'
        required: true

permissions:
  contents: read

jobs:
  set:
    name: config/minRoomVer 갱신
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ github.event.inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 입력 확인 — 형식 · 공개된 릴리스인가
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::버전 형식이 아니다: $VERSION"; exit 1; }
          DRAFT=$(gh release view "v$VERSION" -R "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          [ "$DRAFT" = "false" ] || { echo "::error::v$VERSION 은 공개된 릴리스가 아니다 ($DRAFT) — 없는 버전으로 막으면 아무도 방에 못 들어간다"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - name: 현재 값 → 새 값
        run: |
          FB="npx --yes firebase-tools@15.32.1"
          echo "현재: $($FB database:get /config/minRoomVer --project together-working --instance together-working-default-rtdb 2>/dev/null | tail -n 1)"
          $FB database:set /config/minRoomVer --data "\"$VERSION\"" --project together-working --instance together-working-default-rtdb --force
          echo "변경: $($FB database:get /config/minRoomVer --project together-working --instance together-working-default-rtdb 2>/dev/null | tail -n 1)"
