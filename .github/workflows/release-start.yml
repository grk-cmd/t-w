# ═══ ▶️ release-start — Actions 탭의 [Run workflow] 버튼 하나로 릴리스 시작 ═══════════════════
# 사람이 하던 «git pull → npm run check → npm version … → git push --follow-tags» 를 대신한다.
#   ① 최신 main 받기 → ② 검사(빨강이면 멈춤) → ③ 버전 올림 커밋 + 태그 push(베타는 태그만) → ④ release.yml 을 그 태그로 실행
#   그 뒤(Windows · Mac 빌드 · 설치 파일 검사 · 공개)는 release.yml 이 한다. «초안으로 대기» 를 고르면 공개만 사람이 누른다.
# ★ ② 는 main 의 그 커밋에 checks.yml 이 이미 초록으로 끝났으면 건너뛴다 — 같은 커밋 · 같은 검사라 결과가 같다.
#   못 찾거나(아직 도는 중 · 실패 · 취소) 조회가 실패하면 여기서 다시 돌린다.
# ★ ④ 를 따로 부르는 이유 — 워크플로가 GITHUB_TOKEN 으로 올린 태그는 다른 워크플로를 깨우지 않는다(GitHub 의
#   무한 반복 방지). workflow_dispatch 는 예외라 gh workflow run 으로 직접 부른다.
# ★ main 에 보호 규칙이 생기면 ③ 의 push 가 막힌다 — 그때는 이 워크플로가 push 할 수 있게 예외를 둘 것.

name: release-start

on:
  workflow_dispatch:
    inputs:
      kind:
        description: '버전 종류 — patch 0.10.1→0.10.2 · minor 0.10.1→0.11.0 · beta 0.10.2→0.10.3-beta.N(dev 테스트 · 태그만, main 에 안 올림)'
        type: choice
        options: [patch, minor, beta]
        default: patch
      publish:
        description: '공개 방식 — 자동 공개: 검사를 모두 통과하면 바로 공개 · 초안으로 대기: 초안까지 올리고 GitHub Releases 에서 사람이 Publish'
        type: choice
        options: [자동 공개, 초안으로 대기]
        default: 자동 공개

permissions:
  contents: write   # 버전 커밋 · 태그 push
  actions: write    # release.yml 실행

concurrency:
  group: release-start
  cancel-in-progress: false

jobs:
  start:
    name: 검사 → 버전 올림 → 빌드 시작
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 이 커밋의 checks 결과 찾기
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          # 조회가 실패해도 멈추지 않는다 — 그때는 아래에서 검사를 직접 돌린다.
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?head_sha=$SHA&status=success&per_page=1" \
                  -q '.workflow_runs[0].html_url // empty' 2>/dev/null || true)
          if [ -n "$RUN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "이 커밋(${SHA::7})의 checks 가 이미 통과했다 — 검사를 건너뛴다: $RUN"
            echo "검사: 건너뜀 — main ${SHA::7} 의 checks 통과 기록 $RUN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "이 커밋(${SHA::7})의 checks 통과 기록이 없다(도는 중 · 실패 · 조회 실패) — 여기서 검사를 돌린다"
          fi

      - name: 검사 (npm run check)
        if: steps.ci.outputs.skip != 'true'
        run: node checks/run.js

      - name: 버전 올림 커밋 · 태그 push
        id: bump
        env:
          KIND: ${{ inputs.kind }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$KIND" in
            patch|minor)
              # 정식: main 에 버전 커밋 + 태그. 지금이 베타 번호면(옛 방식) 꼬리만 뗀다 — 0.10.2-beta.1 → 0.10.2.
              npm version "$KIND" -m "chore: %s"
              TAG="v$(node -p "require('./package.json').version")"
              git push origin HEAD:main --follow-tags
              ;;
            beta)
              # 베타: main 에는 올리지 않고 태그만 — 버전 커밋은 태그에만 매달린다(main 기록 · 버전은 정식 번호 그대로).
              # 번호는 «다음 정식 번호 -beta.N», N 은 이미 있는 베타 태그 다음. main 이 0.10.2 면 0.10.3-beta.0 → .1 → …
              CUR=$(node -p "require('./package.json').version")
              case "$CUR" in
                *-*) BASE="${CUR%%-*}" ;;
                *)   BASE=$(node -p "const [a,b,c]=process.argv[1].split('.').map(Number); [a,b,c+1].join('.')" "$CUR") ;;
              esac
              LAST=$(git tag -l "v$BASE-beta.*" | sed -E 's/.*-beta\.([0-9]+)$/\1/' | sort -n | tail -n 1)
              N=$(( ${LAST:--1} + 1 ))
              npm version "$BASE-beta.$N" -m "chore: %s"
              TAG="v$BASE-beta.$N"
              git push origin "$TAG"
              ;;
            *) echo "::error::알 수 없는 종류 $KIND"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### ▶️ $TAG 태그를 올렸다" >> "$GITHUB_STEP_SUMMARY"

      - name: release.yml 실행
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          PUBLISH_KO: ${{ inputs.publish }}
        run: |
          case "$PUBLISH_KO" in
            '초안으로 대기') PUBLISH=draft ;;
            *)               PUBLISH=auto ;;
          esac
          gh workflow run release.yml --repo "${{ github.repository }}" --ref main -f tag="$TAG" -f publish="$PUBLISH"
          if [ "$PUBLISH" = draft ]; then
            echo "Actions › release 에서 $TAG 빌드가 시작된다 — 검사를 모두 통과해도 **초안으로 대기**한다. GitHub Releases 에서 Publish 를 눌러야 공개된다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Actions › release 에서 $TAG 빌드가 시작된다 — 검사를 모두 통과하면 자동으로 공개된다(빨강이면 초안으로 남는다)." >> "$GITHUB_STEP_SUMMARY"
          fi
