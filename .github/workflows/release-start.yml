# ═══ ▶️ release-start — Actions 탭의 [Run workflow] 버튼 하나로 릴리스 시작 ═══════════════════
# 사람이 하던 «git pull → npm run check → npm version … → git push --follow-tags» 를 대신한다.
#   ① 최신 main 받기 → ② 검사(빨강이면 멈춤) → ③ 버전 올림 커밋 + 태그 push → ④ release.yml 을 그 태그로 실행
#   그 뒤(규칙 운영 배포 승인 · Windows · Mac 빌드 · Releases 초안)는 release.yml 이 한다. Publish 는 여전히 사람.
# ★ ④ 를 따로 부르는 이유 — 워크플로가 GITHUB_TOKEN 으로 올린 태그는 다른 워크플로를 깨우지 않는다(GitHub 의
#   무한 반복 방지). workflow_dispatch 는 예외라 gh workflow run 으로 직접 부른다.
# ★ main 에 보호 규칙이 생기면 ③ 의 push 가 막힌다 — 그때는 이 워크플로가 push 할 수 있게 예외를 둘 것.

name: release-start

on:
  workflow_dispatch:
    inputs:
      kind:
        description: '버전 종류 — patch 0.10.1→0.10.2 · minor 0.10.1→0.11.0 · beta 0.10.1→0.10.2-beta.0(dev 테스트, 사용자에게 안 감)'
        type: choice
        options: [patch, minor, beta]
        default: patch

permissions:
  contents: write   # 버전 커밋 · 태그 push
  actions: write    # release.yml 실행

concurrency:
  group: release-start
  cancel-in-progress: false

jobs:
  start:
    name: 검사 → 버전 올림 → 빌드 시작
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 검사 (npm run check)
        run: node checks/run.js

      - name: 버전 올림 커밋 · 태그 push
        id: bump
        env:
          KIND: ${{ inputs.kind }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # beta 는 0.10.1 → 0.10.2-beta.0, 이미 베타면 0.10.2-beta.0 → 0.10.2-beta.1.
          # patch 는 베타 다음이면 꼬리만 떼어 0.10.2-beta.1 → 0.10.2 (npm version 규칙).
          case "$KIND" in
            beta)  npm version prerelease --preid=beta -m "chore: %s" ;;
            patch|minor) npm version "$KIND" -m "chore: %s" ;;
            *) echo "::error::알 수 없는 종류 $KIND"; exit 1 ;;
          esac
          TAG="v$(node -p "require('./package.json').version")"
          git push origin HEAD:main --follow-tags
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### ▶️ $TAG 태그를 올렸다" >> "$GITHUB_STEP_SUMMARY"

      - name: release.yml 실행
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh workflow run release.yml --repo "${{ github.repository }}" --ref main -f tag="$TAG"
          echo "Actions › release 에서 $TAG 빌드가 시작된다 — 끝나면 Releases 초안을 확인하고 Publish." >> "$GITHUB_STEP_SUMMARY"
