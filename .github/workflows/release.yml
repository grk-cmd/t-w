# ═══ 🚀 release — 버전 태그(v*) push 로 Windows · Mac 빌드 → GitHub Releases 초안 ═══════════
# [2026-10-03] 릴리스 순서 «① 규칙 → ② 최신화 → ③ 빌드» 중 ③ 을 자동화한다.
#   ② 최신화(사람):  npm version patch -m "chore: %s"  →  git push --follow-tags
#   ③ 빌드(여기):    태그 push 가 트리거 → exe · dmg ×2 · latest.yml 을 **한 초안**에 올린다
#   Publish(사람):   GitHub Releases 에서 초안 확인 → [Publish release]
# ★ 왜 태그인가 — exe 와 dmg 가 **같은 커밋 · 같은 버전**으로 빌드된다. 예전엔 exe 는 개발자 PC(로컬 버전),
#   dmg 는 mac-probe(main 의 버전)로 따로 만들어 0.10.0 릴리스에 0.9.8 dmg 가 올라간 일이 두 번 있었다.
# ★ 초안까지만 만든다. 사용자에게 나가는 건 사람이 Publish 를 누를 때다.
# ① 규칙: 이전 태그 이후 firebase-database-rules.json 이 바뀌었으면 **운영 배포(production 환경 승인)** 를 빌드보다 먼저 한다.
#   dev 는 main push 때 deploy-dev.yml 이 이미 반영했다. GCP 설정(vars) 전이면 이 단계는 건너뛴다(⚠️ 그땐 사람이 직접 배포).
#   Functions 배포는 권한이 넓어서 넣지 않는다.
# 🔐 oauth-config.js(시크릿)는 npm ci **뒤에** 만든다 — 의존성 설치 스크립트가 시크릿 파일을 읽을 틈을 주지 않는다.
# 🧪 테스트 빌드: 태그에 '-' 가 붙으면(예: v0.10.2-beta.0 ← npm version prerelease --preid=beta) 프리릴리스로 본다.
#   · package.json 에 `twFirebase: dev` 를 박아(--config.extraMetadata) **dev Firebase 에 붙는** 앱을 만든다
#     (main.js FIREBASE_ENV 가 설치본에서 이 값만 본다 · 운영/dev 설정은 둘 다 app/parts/firebase-config.js 에 있다)
#   · 운영 규칙 배포는 하지 않는다 · Releases 에 Pre-release 로 올린다(사용자 앱은 자동 업데이트로 받지 않는다)
# ⚠️ 서명하지 않는다 — mac-probe 와 같다(CSC_IDENTITY_AUTO_DISCOVERY=false). Windows 도 인증서가 없다.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '다시 빌드할 태그 (예: v0.10.1 · 테스트 v0.10.2-beta.0) — 이미 있는 태그여야 한다'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ── 태그와 package.json 버전이 같은가 — 다르면 여기서 멈춘다(버전 어긋남을 원천 차단) ──
  verify:
    name: 버전 확인
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: 태그 = package.json 버전
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "태그: $TAG · package.json: $PKG"
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::태그($TAG)와 package.json 버전(v$PKG)이 다르다 — npm version 으로 올리고 커밋한 뒤 태그를 달 것"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          case "$PKG" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "🧪 테스트 빌드 (dev Firebase · Pre-release)";;
                         *)   echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - name: 마지막 공개 릴리스보다 높은가
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 낮은 버전은 사용자 앱이 업데이트하지 않는다(electron-updater 는 올라가는 방향만 받는다).
          LAST=$(gh release list -R "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          echo "마지막 공개: ${LAST:-없음} · 이번: $TAG"
          [ -z "$LAST" ] && exit 0
          node -e '
            const p = v => v.replace(/^v/, "").split("-")[0].split(".").map(Number);   // -beta.0 꼬리는 떼고 비교
            const [a, b] = [p(process.argv[1]), p(process.argv[2])];
            for (let i = 0; i < 3; i++) { if (a[i] > b[i]) process.exit(0); if (a[i] < b[i]) break; }
            console.error("::error::" + process.argv[1] + " 는 마지막 공개 릴리스 " + process.argv[2] + " 보다 높지 않다");
            process.exit(1);
          ' "$TAG" "$LAST"

  # ── ① 규칙: 이전 태그 이후 규칙 파일이 바뀌었나 ──
  rules-check:
    name: 규칙 변경 확인
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.d.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - id: d
        run: |
          # 정식 태그끼리만 비교한다 — 베타 태그(v*-*)를 «이전» 으로 잡으면 베타 때 이미 들어간 규칙 변경을
          # «안 바뀜» 으로 보고 운영 배포를 건너뛴다(운영에는 아직 없는데).
          PREV=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "$TAG^" 2>/dev/null || true)
          echo "이전 태그: ${PREV:-없음}"
          case "$TAG" in *-*) echo "테스트 빌드 — 운영 규칙 배포 대상 아님"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if [ -z "$PREV" ] || ! git diff --quiet "$PREV" "$TAG" -- firebase-database-rules.json; then
            echo "규칙 파일이 바뀌었다 → 운영 배포 대상"; echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ -z "${{ vars.GCP_WIF_PROVIDER }}" ]; then echo "::warning::규칙이 바뀌었지만 GCP 설정(vars)이 없어 자동 배포를 건너뛴다 — Publish 전에 사람이 firebase deploy --only database 를 할 것"; fi
          else
            echo "규칙 변경 없음"; echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── ① 규칙 → 운영 (production 환경: 승인자가 눌러야 시작한다) ──
  rules-prod:
    name: 규칙 → 운영
    needs: [verify, rules-check]
    if: needs.verify.outputs.prerelease != 'true' && needs.rules-check.outputs.changed == 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - name: firebase deploy --only database (운영)
        run: npx --yes firebase-tools@15.32.1 deploy --only database --project together-working --non-interactive

  # ── Windows: exe · blockmap · latest.yml (latest.yml 은 Windows 자동 업데이트가 읽는다) ──
  build-win:
    name: Windows x64
    needs: [verify, rules-prod]
    if: always() && needs.verify.result == 'success' && (needs.rules-prod.result == 'success' || needs.rules-prod.result == 'skipped')
    # windows-latest(Server 2025) 에서는 node-gyp 가 Visual Studio 를 못 찾아 node-window-manager 빌드가 실패했다.
    # VS 2022 + C++ 도구가 들어 있는 이미지로 고정한다. 이미지가 은퇴하면 node-gyp 를 올려 새 이미지로 옮길 것.
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: oauth-config.js 만들기
        shell: bash
        env:
          OAUTH_CONFIG_JS: ${{ secrets.OAUTH_CONFIG_JS }}
        run: |
          if [ -z "$OAUTH_CONFIG_JS" ]; then echo "::error::OAUTH_CONFIG_JS 시크릿이 비어 있다"; exit 1; fi
          printf '%s' "$OAUTH_CONFIG_JS" > oauth-config.js
          node --check oauth-config.js
      - name: electron-builder (win x64)
        shell: bash
        run: npx electron-builder --win --x64 --publish never $([ "${{ needs.verify.outputs.prerelease }}" = true ] && echo --config.extraMetadata.twFirebase=dev)
      - name: 설정 파일이 asar 에 들어갔는가
        shell: bash
        run: |
          npx --yes @electron/asar@3.2.17 list dist/win-unpacked/resources/app.asar | grep -E "oauth-config.js|firebase-config.js" \
            || { echo "::error::설정 파일이 asar 에 없다"; exit 1; }
          # 🧪 Firebase 환경 표시 — 프리릴리스만 twFirebase=dev, 정식은 없어야 한다(있으면 사용자 앱이 dev 에 붙는다)
          ( cd "$RUNNER_TEMP" && npx --yes @electron/asar@3.2.17 extract-file "$GITHUB_WORKSPACE/dist/win-unpacked/resources/app.asar" package.json \
            && node -e "const e=require('./package.json').twFirebase||'prod'; const want=process.argv[1]==='true'?'dev':'prod'; console.log('Firebase 환경:',e,'(기대',want+')'); process.exit(e===want?0:1)" "${{ needs.verify.outputs.prerelease }}" ) \
            || { echo "::error::설치본의 Firebase 환경 표시가 기대와 다르다"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/beta.yml
            dist/alpha.yml
            dist/rc.yml
          if-no-files-found: error
          retention-days: 3

  # ── Mac: arm64 · x64 따로 (mac-probe 와 같은 이유 — 한쪽이 죽어도 다른 쪽을 잃지 않게) ──
  build-mac:
    name: macOS ${{ matrix.arch }}
    needs: [verify, rules-prod]
    if: always() && needs.verify.result == 'success' && (needs.rules-prod.result == 'success' || needs.rules-prod.result == 'skipped')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: oauth-config.js 만들기
        env:
          OAUTH_CONFIG_JS: ${{ secrets.OAUTH_CONFIG_JS }}
        run: |
          if [ -z "$OAUTH_CONFIG_JS" ]; then echo "::error::OAUTH_CONFIG_JS 시크릿이 비어 있다"; exit 1; fi
          printf '%s' "$OAUTH_CONFIG_JS" > oauth-config.js
          node --check oauth-config.js
      - name: icns 를 iconutil 로 다시 조립 (mac-probe ③ 과 같다)
        run: iconutil -c icns build/icon.iconset -o build/icon.icns
      - name: electron-builder (mac ${{ matrix.arch }})
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never $([ "${{ needs.verify.outputs.prerelease }}" = true ] && echo --config.extraMetadata.twFirebase=dev)
      - name: 설정 파일이 asar 에 들어갔는가
        run: |
          APP=$(ls -d dist/mac*/*.app | head -n 1)
          npx --yes @electron/asar@3.2.17 list "$APP/Contents/Resources/app.asar" | grep -E "oauth-config.js|firebase-config.js" \
            || { echo "::error::설정 파일이 asar 에 없다"; exit 1; }
          # 🧪 Firebase 환경 표시 — 프리릴리스만 twFirebase=dev, 정식은 없어야 한다(있으면 사용자 앱이 dev 에 붙는다)
          ( cd "$RUNNER_TEMP" && npx --yes @electron/asar@3.2.17 extract-file "$GITHUB_WORKSPACE/$APP/Contents/Resources/app.asar" package.json \
            && node -e "const e=require('./package.json').twFirebase||'prod'; const want=process.argv[1]==='true'?'dev':'prod'; console.log('Firebase 환경:',e,'(기대',want+')'); process.exit(e===want?0:1)" "${{ needs.verify.outputs.prerelease }}" ) \
            || { echo "::error::설치본의 Firebase 환경 표시가 기대와 다르다"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          # package.json 의 mac.target 이 arch 를 둘 다 적고 있어서 --arm64 를 줘도 dmg 가 둘 다 나온다.
          # 둘 다 올리면 같은 이름 파일이 merge-multiple 로 동시에 풀리며 섞여 dmg 가 깨진다 — 자기 arch 것만 올린다.
          path: dist/*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 3

  # ── 한 초안에 모아 올린다 (병렬 업로드로 초안이 둘 생기는 경쟁을 피하려고 마지막에 한 번) ──
  publish-draft:
    name: Releases 초안
    needs: [verify, build-win, build-mac]
    # 위 빌드들은 rules-prod 를 needs 로 거친다. 그 단계가 건너뛰어지면(베타 · 규칙이 안 바뀐 릴리스) GitHub 은
    # 기본 조건(success())으로 이 job 까지 건너뛴다 — always() 로 받고 셋의 결과를 직접 본다.
    if: always() && needs.verify.result == 'success' && needs.build-win.result == 'success' && needs.build-mac.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 파일 이름 정리 · 업데이트 정보(yml) 대조
        working-directory: out
        run: |
          # GitHub 는 자산 이름의 공백을 '.' 로 바꾼다. 그런데 latest.yml 의 url 은 '-' 로 적힌다
          # (예전 릴리스: Together-Working-Setup-0.10.0.exe). 공백을 '-' 로 맞춰야 자동 업데이트가 파일을 찾는다.
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /-}"; done
          ls -l
          # 정식은 latest.yml, 프리릴리스는 채널 이름(beta.yml 등)으로 나온다.
          YML=$(ls latest.yml beta.yml alpha.yml rc.yml 2>/dev/null | head -n 1)
          [ -n "$YML" ] || { echo "::error::업데이트 정보 파일(yml)이 없다"; exit 1; }
          # url 은 files: 아래 목록 줄(«  - url: …»)에 있다 — 앞의 «- » 까지 받는다.
          URL=$(grep -E '^[[:space:]]*(-[[:space:]]*)?url:' "$YML" | head -n 1 | sed -E 's/^[[:space:]]*(-[[:space:]]*)?url:[[:space:]]*//')
          echo "$YML url: $URL"
          [ -f "$URL" ] || { echo "::error::$YML 이 가리키는 $URL 이 없다 — 자동 업데이트가 깨진다"; exit 1; }
          grep -q "version: $VERSION" "$YML" || { echo "::error::$YML 버전이 $VERSION 이 아니다"; exit 1; }
      - name: 초안 만들기 / 올리기
        working-directory: out
        run: |
          REPO=${{ github.repository }}
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" -R "$REPO" --json isDraft -q .isDraft)
            if [ "$DRAFT" != "true" ]; then
              echo "::error::$TAG 는 이미 공개된 릴리스다 — 공개본은 덮어쓰지 않는다"; exit 1
            fi
            gh release upload "$TAG" -R "$REPO" --clobber *
          else
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" -R "$REPO" --draft --prerelease --verify-tag --title "$VERSION (테스트 · dev 서버)" \
                --notes "🧪 테스트 빌드 — **dev Firebase(together-working-dev)** 에 접속합니다. 운영 데이터와 분리돼 있고, 일반 사용자 앱은 자동 업데이트로 받지 않습니다. (커밋 ${GITHUB_SHA::7})" *
            else
              gh release create "$TAG" -R "$REPO" --draft --verify-tag --title "$VERSION" \
                --notes "자동 빌드 초안 (커밋 ${GITHUB_SHA::7}). 확인 후 Publish 하세요." *
            fi
          fi
          gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name'
      - name: 올라간 파일이 원본과 같은가
        working-directory: out
        run: |
          # 업로드 도중 깨져도 GitHub 는 성공으로 끝낸다 — 릴리스에 붙은 sha256 을 로컬 원본과 대조한다.
          gh release view "$TAG" -R ${{ github.repository }} --json assets -q '.assets[] | "\(.name) \(.digest)"' > remote.txt
          BAD=0
          for f in *; do
            [ "$f" = remote.txt ] && continue
            WANT="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            GOT=$(awk -v n="$f" '$1 == n { print $2 }' remote.txt)
            if [ "$WANT" = "$GOT" ]; then echo "같음: $f"; else echo "::error::$f — 원본 $WANT · 릴리스 ${GOT:-없음}"; BAD=1; fi
          done
          exit $BAD
